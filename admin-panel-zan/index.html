<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم - بلدية زان</title>
    <link rel="stylesheet" href="assets/css/admin-style-rtl.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

    <div class="login-card">
        <img src="assets/images/Logo Zan.png" alt="شعار بلدية زان" class="login-logo">
        <h2 class="login-title">لوحة تحكم بلدية زان</h2>

        <form action="dashboard.html" method="GET">
            <div class="form-group" style="text-align: right;">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" class="form-control" placeholder="admin@zan.gov.lb" required>
            </div>

            <div class="form-group" style="text-align: right;">
                <label class="form-label">كلمة المرور</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                تسجيل الدخول
            </button>
        </form>

        <div style="margin-top: 20px; color: #757575; font-size: 0.9rem;">
            &copy; <span class="arabic-num">2023</span> بلدية زان. جميع الحقوق محفوظة.
        </div>
    </div>

    <script src="assets/js/admin-main.js"></script>
</body>
</html>
